<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Drink Offline - Eurospin</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            transition: background 0.3s; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            justify-content: center;
            /* Sfondo con Logo Eurospin */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_Eurospin.svg/1200px-Logo_Eurospin.svg.png');
            background-repeat: no-repeat;
            background-position: center 10%; 
            background-size: 200px; 
        }
        
        /* Velatura per garantire la leggibilità del testo */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8); 
            z-index: -1;
        }

        #status { font-size: 2rem; font-weight: bold; margin: 20px; z-index: 1; }
        #info { font-size: 1.2rem; color: #333; white-space: pre-line; z-index: 1; font-weight: 500; }
        button { 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            background: #004a99; /* Blu Eurospin */
            color: white; 
            z-index: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="status">ATTESA AVVIO</div>
    <div id="info">Premi il tasto per attivare lo scanner offline</div>
    <br>
    <button id="startBtn">ATTIVA SCANNER</button>

    <script>
        // Gestione errori visibile sul display del telefono
        window.onerror = function(msg, url, linenumber) {
            alert('ERRORE JS: ' + msg + '\nLinea: ' + linenumber);
            return true;
        };

        const statusDiv = document.getElementById('status');
        const infoDiv = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        
        // CONFIGURAZIONE APPLICAZIONE
        const LIMITE_DRINK = 1;
        const prefissoAutorizzato = "04"; // Cambialo con il prefisso dei tuoi badge

        // DATABASE IN LOCALE (inizializza il database vuoto se non esiste)
        let databaseLocale = JSON.parse(localStorage.getItem('eurospinDrinkDB')) || {};

        // Funzione di logica offline
        function gestisciLettura(idBadge) {
            // 1. Controllo Prefisso Carta
            if (!idBadge.startsWith(prefissoAutorizzato)) {
                document.body.style.backgroundColor = "#f1c40f"; // Giallo
                statusDiv.innerText = "BADGE NON VALIDO";
                infoDiv.innerText = `Badge: ${idBadge}\nNon appartiene a Eurospin.`;
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                
                setTimeout(() => {
                    document.body.style.backgroundColor = "transparent";
                    statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                    infoDiv.innerText = "Scanner attivo (Offline)...";
                }, 3000);
                return;
            }

            // 2. Controllo e incremento dei drink nel database locale
            if (!databaseLocale[idBadge]) {
                databaseLocale[idBadge] = 0; // Inizializza a 0 se è la prima volta che si vede questa carta
            }

            let consumati = databaseLocale[idBadge];

            if (consumati < LIMITE_DRINK) {
                databaseLocale[idBadge]++; // Incrementa il drink
                localStorage.setItem('eurospinDrinkDB', JSON.stringify(databaseLocale)); // Salva permanentemente sul telefono
                
                mostraRisultato(true, databaseLocale[idBadge], idBadge);
            } else {
                mostraRisultato(false, consumati, idBadge);
            }
        }

        // Attivazione sensore NFC
        startBtn.addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                    infoDiv.innerText = "Scanner attivo (Offline)...";

                    ndef.onreading = event => {
                        const serialNumber = event.serialNumber;
                        if (navigator.vibrate) navigator.vibrate(100); // Feedback immediato al tocco
                        gestisciLettura(serialNumber);
                    };

                } catch (error) {
                    alert("Errore NFC: " + error);
                }
            } else {
                alert("NFC non supportato su questo browser/dispositivo.");
            }
        });

        function mostraRisultato(successo, conteggio, id) {
            if (successo) {
                document.body.style.backgroundColor = "#2ecc71"; // Verde
                statusDiv.innerText = "DRINK OK!";
                infoDiv.innerText = `Badge: ${id}\nConsumati: ${conteggio} / ${LIMITE_DRINK}`;
            } else {
                document.body.style.backgroundColor = "#e74c3c"; // Rosso
                statusDiv.innerText = "LIMITE RAGGIUNTO!";
                infoDiv.innerText = `Badge: ${id}\nHa già consumato ${conteggio} drink.`;
            }
            
            if (navigator.vibrate) navigator.vibrate(successo ? 200 : [100, 50, 100]);

            setTimeout(() => {
                document.body.style.backgroundColor = "transparent";
                statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                infoDiv.innerText = "Scanner attivo (Offline)...";
            }, 3000);
        }
    </script>
</body>
</html>
