<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NFC Drink Offline - Eurospin</title>
    <style>
        /* Blocco totale dello zoom e dello scroll nativo su tutta la PWA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            touch-action: none; 
        }

        body { 
            font-family: sans-serif; 
            text-align: center; 
            transition: background 0.3s; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            position: relative; 
            background-color: #004a99;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_Eurospin.svg/1200px-Logo_Eurospin.svg.png');
            background-repeat: no-repeat;
            background-position: center 15%; 
            background-size: 240px; 
            
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 74, 153, 0.6); 
            z-index: -1;
        }

        /* Indicatore di Build aggiornato a b1.2 */
        #buildVersion {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: bold;
            z-index: 1;
            letter-spacing: 0.5px;
        }

        #status { font-size: 2.2rem; font-weight: bold; margin: 20px; z-index: 1; color: #ffdd00; }
        #info { font-size: 1.3rem; color: #ffffff; white-space: pre-line; z-index: 1; font-weight: 500; }
        
        button { 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            border: 2px solid #ffffff; 
            border-radius: 5px; 
            background: #ffdd00; 
            color: #004a99; 
            z-index: 1;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        #stats {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            z-index: 1;
            letter-spacing: 0.5px;
        }

        #secretZone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 85px;
            height: 85px;
            z-index: 999;
            background: transparent;
        }

        .custom-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 74, 153, 0.95);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            border: 3px solid #ffdd00;
            background: #004a99;
            padding: 25px;
            border-radius: 10px;
            width: 80%;
            max-width: 350px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .modal-content h3 {
            color: #ffdd00;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .modal-content p {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        .modal-actions {
            display: flex;
            justify-content: space-around;
        }

        .btn-modal {
            padding: 10px 20px;
            font-size: 1rem;
            min-width: 110px;
        }

        .btn-cancel {
            background: #ffffff;
            color: #004a99;
        }

        .btn-confirm {
            background: #e74c3c;
            color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="buildVersion">b1.2</div>

    <div id="status">ATTESA AVVIO</div>
    <div id="info">Premi il tasto per attivare lo scanner offline</div>
    <br>
    <button id="startBtn">ATTIVA SCANNER</button>

    <div id="stats"></div>
    <div id="secretZone"></div>

    <div id="resetModal" class="custom-modal">
        <div class="modal-content">
            <h3>⚠️ RESET MEMORIA</h3>
            <p>Vuoi cancellare definitivamente tutti i drink erogati e azzerare i contatori della serata?</p>
            <div class="modal-actions">
                <button id="cancelResetBtn" class="btn-modal btn-cancel">ANNULLA</button>
                <button id="confirmResetBtn" class="btn-modal btn-confirm">AZZERA</button>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, linenumber) {
            alert('ERRORE JS: ' + msg + '\nLinea: ' + linenumber);
            return true;
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registrato!'))
                .catch(err => console.log('Errore SW:', err));
        }

        const statusDiv = document.getElementById('status');
        const infoDiv = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const statsDiv = document.getElementById('stats');
        const secretZone = document.getElementById('secretZone');
        const resetModal = document.getElementById('resetModal');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const confirmResetBtn = document.getElementById('confirmResetBtn');

        let databaseLocale = JSON.parse(localStorage.getItem('eurospinDrinkDB')) || {};
        
        // Flag di sicurezza per impedire letture anticipate
        let scannerAttivo = false;

        function aggiornaStatistiche() {
            const badgeTotali = Object.keys(databaseLocale).length;
            const drinkTotali = Object.values(databaseLocale).reduce((a, b) => a + b, 0);
            statsDiv.innerHTML = `👥 Badge letti: ${badgeTotali} &nbsp;|&nbsp; 🍹 Drink erogati: ${drinkTotali}`;
        }

        function gestisciLettura(idBadge) {
            // Clausola di sicurezza: se lo scanner non è esplicitamente attivo, ignora tutto
            if (!scannerAttivo) return;

            if (databaseLocale[idBadge] !== undefined) {
                mostraRisultato(false, databaseLocale[idBadge], idBadge);
            } else {
                databaseLocale[idBadge] = 3; 
                localStorage.setItem('eurospinDrinkDB', JSON.stringify(databaseLocale)); 
                mostraRisultato(true, databaseLocale[idBadge], idBadge);
            }
        }

        async function avviaScannerNFC(e) {
            if (e) e.preventDefault(); 
            
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    
                    // Attiviamo il flag solo DOPO che l'hardware ha risposto correttamente
                    scannerAttivo = true;
                    
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                    infoDiv.innerText = "Scanner attivo (Offline)...";
                    aggiornaStatistiche();

                    ndef.onreading = event => {
                        const serialNumber = event.serialNumber;
                        if (navigator.vibrate) navigator.vibrate(100); 
                        gestisciLettura(serialNumber);
                    };

                } catch (error) {
                    alert("Errore NFC: " + error);
                }
            } else {
                alert("NFC non supportato su questo browser/dispositivo.");
            }
        }

        startBtn.addEventListener('touchstart', avviaScannerNFC);
        startBtn.addEventListener('click', avviaScannerNFC);

        function mostraRisultato(successo, conteggio, id) {
            if (successo) {
                document.body.style.backgroundColor = "#2ecc71"; 
                statusDiv.style.color = "#ffffff";
                infoDiv.style.color = "#ffffff";
                statusDiv.innerText = "+3 DRINK AGGIUNTI!";
                infoDiv.innerText = `Badge: ${id}\nTotale questo badge: ${conteggio}`;
                if (navigator.vibrate) navigator.vibrate(200);
            } else {
                document.body.style.backgroundColor = "#e74c3c"; 
                statusDiv.style.color = "#ffffff";
                infoDiv.style.color = "#ffffff";
                statusDiv.innerText = "GIÀ PASSATO!";
                infoDiv.innerText = `Badge: ${id}\nQuesto badge ha già ricevuto i suoi 3 drink.`;
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }

            setTimeout(() => {
                ripristinaSchermataStato();
            }, 3000);
        }

        function ripristinaSchermataStato() {
            document.body.style.backgroundColor = "#004a99"; 
            statusDiv.style.color = "#ffdd00"; 
            infoDiv.style.color = "#ffffff"; 
            statusDiv.innerText = "PRONTO: AVVICINA BADGE";
            infoDiv.innerText = "Scanner attivo (Offline)...";
            aggiornaStatistiche(); 
        }

        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        let resetClicks = 0;
        let resetTimer;

        secretZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            resetClicks++;
            clearTimeout(resetTimer);

            if (resetClicks === 5) {
                resetClicks = 0;
                resetModal.style.display = 'flex'; 
            } else {
                resetTimer = setTimeout(() => {
                    resetClicks = 0;
                }, 1500); 
            }
        });

        cancelResetBtn.addEventListener('click', () => {
            resetModal.style.display = 'none';
        });

        confirmResetBtn.addEventListener('click', () => {
            localStorage.removeItem('eurospinDrinkDB');
            databaseLocale = {};
            resetModal.style.display = 'none';
            
            document.body.style.backgroundColor = "#ffdd00"; 
            statusDiv.style.color = "#004a99";
            infoDiv.style.color = "#004a99";
            statusDiv.innerText = "MEMORIA AZZERATA";
            infoDiv.innerText = "Tutti i contatori sono tornati a 0";
            
            setTimeout(() => {
                ripristinaSchermataStato();
            }, 2500);
        });
    </script>
</body>
</html>
