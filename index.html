<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Drink Offline - Eurospin</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            transition: background 0.3s; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            justify-content: center;
            background-color: #004a99;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_Eurospin.svg/1200px-Logo_Eurospin.svg.png');
            background-repeat: no-repeat;
            background-position: center 15%; 
            background-size: 240px; 
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 74, 153, 0.6); 
            z-index: -1;
        }

        #status { font-size: 2.2rem; font-weight: bold; margin: 20px; z-index: 1; color: #ffdd00; }
        #info { font-size: 1.3rem; color: #ffffff; white-space: pre-line; z-index: 1; font-weight: 500; }
        
        button { 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            border: 2px solid #ffffff; 
            border-radius: 5px; 
            background: #ffdd00; 
            color: #004a99; 
            z-index: 1;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        #stats {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: bold;
            z-index: 1;
            letter-spacing: 0.5px;
        }

        /* Area segreta invisibile nell'angolo in basso a sinistra */
        #secretZone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 80px;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="status">ATTESA AVVIO</div>
    <div id="info">Premi il tasto per attivare lo scanner offline</div>
    <br>
    <button id="startBtn">ATTIVA SCANNER</button>

    <div id="stats"></div>
    
    <div id="secretZone"></div>

    <script>
        window.onerror = function(msg, url, linenumber) {
            alert('ERRORE JS: ' + msg + '\nLinea: ' + linenumber);
            return true;
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registrato!'))
                .catch(err => console.log('Errore SW:', err));
        }

        const statusDiv = document.getElementById('status');
        const infoDiv = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const statsDiv = document.getElementById('stats');
        const secretZone = document.getElementById('secretZone');

        let databaseLocale = JSON.parse(localStorage.getItem('eurospinDrinkDB')) || {};

        function aggiornaStatistiche() {
            const badgeTotali = Object.keys(databaseLocale).length;
            const drinkTotali = Object.values(databaseLocale).reduce((a, b) => a + b, 0);
            statsDiv.innerHTML = `👥 Badge letti: ${badgeTotali} &nbsp;|&nbsp; 🍹 Drink erogati: ${drinkTotali}`;
        }

        function gestisciLettura(idBadge) {
            if (!databaseLocale[idBadge]) {
                databaseLocale[idBadge] = 0;
            }

            databaseLocale[idBadge] += 3; 
            localStorage.setItem('eurospinDrinkDB', JSON.stringify(databaseLocale)); 
            
            mostraRisultato(databaseLocale[idBadge], idBadge);
        }

        startBtn.addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                    infoDiv.innerText = "Scanner attivo (Offline)...";
                    aggiornaStatistiche();

                    ndef.onreading = event => {
                        const serialNumber = event.serialNumber;
                        if (navigator.vibrate) navigator.vibrate(100); 
                        gestisciLettura(serialNumber);
                    };

                } catch (error) {
                    alert("Errore NFC: " + error);
                }
            } else {
                alert("NFC non supportato su questo browser/dispositivo.");
            }
        });

        function mostraRisultato(conteggio, id) {
            document.body.style.backgroundColor = "#2ecc71"; 
            statusDiv.style.color = "#ffffff";
            infoDiv.style.color = "#ffffff";
            statusDiv.innerText = "+3 DRINK AGGIUNTI!";
            infoDiv.innerText = `Badge: ${id}\nTotale questo badge: ${conteggio}`;
            
            if (navigator.vibrate) navigator.vibrate(200);

            setTimeout(() => {
                ripristinaSchermataStato();
            }, 3000);
        }

        function ripristinaSchermataStato() {
            document.body.style.backgroundColor = "#004a99"; 
            statusDiv.style.color = "#ffdd00"; 
            infoDiv.style.color = "#ffffff"; 
            statusDiv.innerText = "PRONTO: AVVICINA BADGE";
            infoDiv.innerText = "Scanner attivo (Offline)...";
            aggiornaStatistiche(); 
        }

        // LOGICA DEL MENU SEGRETO DI RESET (5 Clic in basso a sinistra)
        let resetClicks = 0;
        let resetTimer;

        secretZone.addEventListener('click', () => {
            resetClicks++;
            clearTimeout(resetTimer);

            if (resetClicks === 5) {
                resetClicks = 0;
                // Finestra di conferma per evitare tocchi accidentali
                const conferma = confirm("⚠️ AZZERAMENTO TOTALI\n\nVuoi cancellare definitivamente tutta la memoria dei drink e dei badge passati?");
                if (conferma) {
                    localStorage.removeItem('eurospinDrinkDB');
                    databaseLocale = {};
                    aggiornaStatistiche();
                    alert("Database azzerato. I contatori sono tornati a 0!");
                }
            } else {
                // Se passano più di 2 secondi senza cliccare, il conteggio si azzera
                resetTimer = setTimeout(() => {
                    resetClicks = 0;
                }, 2000);
            }
        });
    </script>
</body>
</html>
