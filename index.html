<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Drink Online - Eurospin</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            transition: background 0.3s; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            justify-content: center;
            /* Sfondo con Logo */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_Eurospin.svg/1200px-Logo_Eurospin.svg.png');
            background-repeat: no-repeat;
            background-position: center 10%; /* Posizionato in alto al centro */
            background-size: 200px; /* Dimensione del logo */
        }
        
        /* Overlay per rendere lo sfondo meno invasivo se necessario */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8); /* Velatura bianca per leggere meglio i testi */
            z-index: -1;
        }

        #status { font-size: 2rem; font-weight: bold; margin: 20px; z-index: 1; }
        #info { font-size: 1.2rem; color: #333; white-space: pre-line; z-index: 1; font-weight: 500; }
        button { 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            border: none; 
            border-radius: 5px; 
            background: #004a99; /* Blu Eurospin */
            color: white; 
            z-index: 1;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="status">CONNETTENDO...</div>
    <div id="info">Inizializzazione database online</div>
    <br>
    <button id="startBtn" style="display:none;">ATTIVA SCANNER</button>

    <script>
        window.onerror = function(msg, url, linenumber) {
            alert('ERRORE JS: ' + msg + '\nLinea: ' + linenumber);
            return true;
        };

        const firebaseConfig = {
            apiKey: "AIzaSyAEGj9hgwY77KhRMbaBlVa7h_oFn5jsOgM",
            authDomain: "drinknfc.firebaseapp.com",
            databaseURL: "https://drinknfc-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "drinknfc",
            storageBucket: "drinknfc.firebasestorage.app",
            messagingSenderId: "781441954375",
            appId: "1:781441954375:web:63b5079a61970696183762"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const statusDiv = document.getElementById('status');
        const infoDiv = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        const LIMITE_DRINK = 3;

        statusDiv.innerText = "ONLINE";
        infoDiv.innerText = "Sistema pronto";
        startBtn.style.display = 'inline-block';

        async function gestisciLettura(idBadge) {
            const prefissoAutorizzato = "04"; // Modifica con il tuo prefisso reale

            if (!idBadge.startsWith(prefissoAutorizzato)) {
                document.body.style.backgroundColor = "#f1c40f";
                statusDiv.innerText = "BADGE NON VALIDO";
                infoDiv.innerText = `Badge: ${idBadge}\nNon autorizzato.`;
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                setTimeout(() => { document.body.style.backgroundColor = "transparent"; statusDiv.innerText = "PRONTO: AVVICINA BADGE"; }, 3000);
                return;
            }

            try {
                const userRef = db.ref('utenti/' + idBadge);
                const snapshot = await userRef.get();
                let consumati = snapshot.exists() ? snapshot.val().drinkConsumati : 0;

                if (consumati < LIMITE_DRINK) {
                    const nuoviDrink = consumati + 1;
                    await userRef.set({ drinkConsumati: nuoviDrink, ultimoDrink: new Date().toISOString() });
                    mostraRisultato(true, nuoviDrink, idBadge);
                } else {
                    mostraRisultato(false, consumati, idBadge);
                }
            } catch (e) { alert("Errore Database: " + e.message); }
        }

        startBtn.addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                    infoDiv.innerText = "Scanner attivo...";
                    ndef.onreading = event => {
                        if (navigator.vibrate) navigator.vibrate(100);
                        gestisciLettura(event.serialNumber);
                    };
                } catch (error) { alert("Errore NFC: " + error); }
            } else { alert("NFC non supportato."); }
        });

        function mostraRisultato(successo, conteggio, id) {
            if (successo) {
                document.body.style.backgroundColor = "#2ecc71";
                statusDiv.innerText = "DRINK OK!";
                infoDiv.innerText = `Badge: ${id}\nConsumati: ${conteggio} / ${LIMITE_DRINK}`;
            } else {
                document.body.style.backgroundColor = "#e74c3c";
                statusDiv.innerText = "LIMITE RAGGIUNTO!";
                infoDiv.innerText = `Badge: ${id}\nGià consumati ${conteggio} drink.`;
            }
            if (navigator.vibrate) navigator.vibrate(successo ? 200 : [100, 50, 100]);
            setTimeout(() => {
                document.body.style.backgroundColor = "transparent";
                statusDiv.innerText = "PRONTO: AVVICINA BADGE";
            }, 3000);
        }
    </script>
</body>
</html>
