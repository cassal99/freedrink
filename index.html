<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC Drink Offline - Eurospin</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            transition: background 0.3s; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            justify-content: center;
            /* Sfondo Blu Eurospin */
            background-color: #004a99;
            /* Sfondo con Logo Eurospin */
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Logo_Eurospin.svg/1200px-Logo_Eurospin.svg.png');
            background-repeat: no-repeat;
            background-position: center 15%; 
            background-size: 240px; 
        }
        
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 74, 153, 0.6); 
            z-index: -1;
        }

        #status { font-size: 2.2rem; font-weight: bold; margin: 20px; z-index: 1; color: #ffdd00; }
        #info { font-size: 1.3rem; color: #ffffff; white-space: pre-line; z-index: 1; font-weight: 500; }
        
        button { 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            cursor: pointer; 
            border: 2px solid #ffffff; 
            border-radius: 5px; 
            background: #ffdd00; /* Giallo Eurospin */
            color: #004a99; 
            z-index: 1;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="status">ATTESA AVVIO</div>
    <div id="info">Premi il tasto per attivare lo scanner offline</div>
    <br>
    <button id="startBtn">ATTIVA SCANNER</button>

    <script>
        window.onerror = function(msg, url, linenumber) {
            alert('ERRORE JS: ' + msg + '\nLinea: ' + linenumber);
            return true;
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('Service Worker Registrato!'))
                .catch(err => console.log('Errore SW:', err));
        }

        const statusDiv = document.getElementById('status');
        const infoDiv = document.getElementById('info');
        const startBtn = document.getElementById('startBtn');
        
        const LIMITE_DRINK = 1;
        const prefissoAutorizzato = "04"; 

        let databaseLocale = JSON.parse(localStorage.getItem('eurospinDrinkDB')) || {};

        function gestisciLettura(idBadge) {
            if (!idBadge.startsWith(prefissoAutorizzato)) {
                document.body.style.backgroundColor = "#f1c40f"; // Giallo
                statusDiv.style.color = "#000000";
                infoDiv.style.color = "#000000";
                statusDiv.innerText = "BADGE NON VALIDO";
                infoDiv.innerText = `Badge: ${idBadge}\nNon appartiene a Eurospin.`;
                if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
                
                setTimeout(() => {
                    ripristinaSchermataStato();
                }, 3000);
                return;
            }

            if (!databaseLocale[idBadge]) {
                databaseLocale[idBadge] = 0;
            }

            let consumati = databaseLocale[idBadge];

            if (consumati < LIMITE_DRINK) {
                databaseLocale[idBadge]++; 
                localStorage.setItem('eurospinDrinkDB', JSON.stringify(databaseLocale)); 
                mostraRisultato(true, databaseLocale[idBadge], idBadge);
            } else {
                mostraRisultato(false, consumati, idBadge);
            }
        }

        startBtn.addEventListener('click', async () => {
            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    
                    startBtn.style.display = 'none';
                    statusDiv.innerText = "PRONTO: AVVICINA BADGE";
                    infoDiv.innerText = "Scanner attivo (Offline)...";

                    ndef.onreading = event => {
                        const serialNumber = event.serialNumber;
                        if (navigator.vibrate) navigator.vibrate(100); 
                        gestisciLettura(serialNumber);
                    };

                } catch (error) {
                    alert("Errore NFC: " + error);
                }
            } else {
                alert("NFC non supportato su questo browser/dispositivo.");
            }
        });

        function mostraRisultato(successo, conteggio, id) {
            if (successo) {
                document.body.style.backgroundColor = "#2ecc71"; // Verde
                statusDiv.style.color = "#ffffff";
                infoDiv.style.color = "#ffffff";
                statusDiv.innerText = "DRINK OK!";
                infoDiv.innerText = `Badge: ${id}\nConsumati: ${conteggio} / ${LIMITE_DRINK}`;
            } else {
                document.body.style.backgroundColor = "#e74c3c"; // Rosso
                statusDiv.style.color = "#ffffff";
                infoDiv.style.color = "#ffffff";
                statusDiv.innerText = "LIMITE RAGGIUNTO!";
                infoDiv.innerText = `Badge: ${id}\nHa già consumato ${conteggio} drink.`;
            }
            
            if (navigator.vibrate) navigator.vibrate(successo ? 200 : [100, 50, 100]);

            setTimeout(() => {
                ripristinaSchermataStato();
            }, 3000);
        }

        function ripristinaSchermataStato() {
            document.body.style.backgroundColor = "#004a99"; 
            statusDiv.style.color = "#ffdd00"; 
            infoDiv.style.color = "#ffffff"; 
            statusDiv.innerText = "PRONTO: AVVICINA BADGE";
            infoDiv.innerText = "Scanner attivo (Offline)...";
        }
    </script>
</body>
</html>
